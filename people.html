<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who testified &middot; CT Cannabis Law</title>
<meta name="description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Who testified &middot; CT Cannabis Law">
<meta property="og:description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script>
/* set the theme before first paint so the page never flashes the wrong one */
try { var t = localStorage.getItem('ctcl-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<main id="main">

<div class="page-head">
  <div class="eyebrow">Ranked by how often they filed</div>
  <h1>Who testified</h1>
  <p class="lede">Everyone who filed written testimony on a Connecticut cannabis bill, with a label for who they are: lawmaker, state agency, police, town official, industry, advocate, health professional or member of the public. Tap a name to see everything they filed.</p>
</div>

<div class="grid four" id="stats"></div>

<div id="profile"></div>

<div class="filters" id="f"></div>
<div class="resultbar">
  <span id="count"></span>
  <span style="display:flex;gap:.6rem;align-items:center">
    <span class="segmented" id="sortseg" role="group" aria-label="Sort">
      <button type="button" data-s="n" aria-pressed="true">Most filings</button>
      <button type="button" data-s="bills" aria-pressed="false">Most bills</button>
      <button type="button" data-s="who" aria-pressed="false">A to Z</button>
    </span>
    <button class="btn" id="dl" type="button">Download CSV</button>
  </span>
</div>
<div class="records" id="list"></div>
<div class="pagenav"><button class="btn" id="more" type="button" hidden>Show more</button></div>

</main>
<script type="module">

import { load, $, $$, num, esc, plural, fmtDate, searchField, selectField, clearButton, wire,
         downloadCSV, fail, kindChip, dirChip, leanDot, billHref, legHref } from './assets/app.js';

try {
  const [d, BB] = await Promise.all([load('testimony'), load('bills')]);
  const BILL = new Map(BB.bills.map(b => [b.id, b]));
  const qs = new URLSearchParams(location.search);
  function profile(id) {
    const s = d.speakers.find(x => x.id === id);
    if (!s) { $('#profile').innerHTML = ''; return; }
    const rows = d.rows.filter(r => r.eid === id).sort((a, b) => b.yr.localeCompare(a.yr));
    $('#profile').innerHTML = `<div class="card" style="margin:0 0 1rem">
      <div class="profile-head"><h2>${esc(s.who)}</h2><span class="chips">${kindChip(s.k)}
        ${s.leg ? `<a class="chip" href="${legHref(s.leg)}">Voting Record as a Lawmaker</a>` : ''}
        <button class="btn" type="button" id="pclose">Back to Everyone</button></span></div>
      <p class="small muted" style="margin:.3rem 0">${esc(s.orgs.join('; ') || 'No organization given')} &middot; filed ${plural(s.n, 'time')} on ${plural(s.bills, 'bill')}, ${esc(s.first)}&ndash;${esc(s.last)}${s.aka.length ? ` &middot; also filed as ${esc(s.aka.join('; '))}` : ''}</p>
      ${s.st.pro + s.st.anti ? `<p style="margin:.2rem 0 .6rem">${leanDot(s.st.pro, s.st.anti, true)} <span class="small muted">&middot; ${s.st.pro} pro-cannabis and ${s.st.anti} anti-cannabis positions on bills that clearly expand access or add enforcement</span></p>` : ''}
      <div class="vlist">${rows.map(r => { const b = BILL.get(r.bid); return `<div class="vrow" style="grid-template-columns:auto minmax(0,1fr) auto">
        <span class="chip ${r.p === 'Supports' ? 'ok' : r.p === 'Opposes' ? 'bad' : ''}">${esc(r.p)}</span>
        <div><div class="l1">${b ? dirChip(b.dir) : ''} <a href="${billHref(r.bid)}"><strong>${esc(b ? b.num : r.b)}</strong> (${esc(r.yr)})</a> <span class="muted">&middot; ${esc(r.c)} committee</span></div>
          <div class="l2">${esc(b ? b.title : '')}</div>${r.how === 'Text' ? '<div class="small muted">Position read from the filing text</div>' : ''}</div>
        <div class="end">${r.u ? `<a href="${esc(r.u)}" rel="noopener">Read It &#8599;</a>` : ''}</div></div>`; }).join('')}</div></div>`;
    $('#pclose').onclick = () => { history.replaceState(null, '', 'people.html'); $('#profile').innerHTML = ''; };
    $('#profile').scrollIntoView({ behavior: 'smooth' });
  }
  const S = d.summary;
  const POS = { Supports: 'var(--pro)', Opposes: 'var(--anti)', Other: 'var(--s8)' };

  $('#stats').innerHTML = [
    ['hero', S.people, 'named parties filed testimony'],
    ['', S.records, 'filings in total'],
    ['', S.repeat, 'filed on more than one occasion'],
    ['', S.once_only, 'filed exactly once'],
  ].map(([k, n, lab]) =>
    `<div class="stat ${k}"><div class="n">${num(n)}</div><div class="k">${esc(lab)}</div></div>`).join('');

  const years = [...new Set(d.speakers.flatMap(s => [s.first, s.last]))].sort().reverse();
  $('#f').innerHTML =
    searchField('q', 'Search a name or organization', 'name, organization') +
    selectField('kd', 'Who', d.speakers.length ? [...new Set(d.speakers.map(x => x.k).filter(Boolean))].sort().map(x => [x, x]) : [], { all: 'Everyone' }) +
    selectField('yr', 'Active in', years) +
    selectField('st', 'Stance', [['sup', 'Supported at least once'],
                                 ['opp', 'Opposed at least once'],
                                 ['both', 'Both supported and opposed']]) +
    selectField('rep', 'Frequency', [['rep', 'Filed more than once'], ['one', 'Filed once']]) +
    clearButton();

  let sortKey = 'n', limit = 60;

  function current() {
    const kd = $('#kd').value, q = $('#q').value.trim().toLowerCase(), yr = $('#yr').value,
          st = $('#st').value, rep = $('#rep').value;
    let rows = d.speakers.filter(s => {
      if (kd && s.k !== kd) return false;
      if (q && !(s.who + ' ' + s.orgs.join(' ') + ' ' + s.aka.join(' ')).toLowerCase().includes(q)) return false;
      if (yr && !(s.first <= yr && s.last >= yr)) return false;
      if (st === 'sup' && !s.sup) return false;
      if (st === 'opp' && !s.opp) return false;
      if (st === 'both' && !(s.sup && s.opp)) return false;
      if (rep === 'rep' && s.n < 2) return false;
      if (rep === 'one' && s.n !== 1) return false;
      return true;
    });
    rows.sort(sortKey === 'who'
      ? (a, b) => a.who.localeCompare(b.who, 'en')
      : (a, b) => b[sortKey] - a[sortKey] || a.who.localeCompare(b.who, 'en'));
    return rows;
  }

  function draw() {
    const rows = current();
    const hi = Math.max(1, ...rows.map(r => r.n));
    $('#count').innerHTML = `<strong>${num(rows.length)}</strong> of ${num(d.speakers.length)} named parties`;
    const view = rows.slice(0, limit);
    $('#list').innerHTML = view.length ? view.map((s, i) => {
      const segs = [['Supports', s.sup], ['Opposes', s.opp], ['Other', s.oth]]
        .filter(([, v]) => v > 0)
        .map(([k, v]) => `<i style="flex:0 0 ${(v / hi) * 100}%;background:${POS[k]}"
              title="${esc(k)}: ${num(v)}"></i>`).join('');
      const stance = [s.sup ? `${num(s.sup)} supporting` : '', s.opp ? `${num(s.opp)} opposing` : '',
                      s.oth ? `${num(s.oth)} other or unstated` : ''].filter(Boolean).join(' &middot; ');
      return `<a class="rank" href="?id=${esc(s.id)}" data-id="${esc(s.id)}" style="text-decoration:none;color:inherit">
        <div class="pos">${num(i + 1)}</div>
        <div>
          <div class="who">${leanDot(s.st.pro, s.st.anti)} <span style="color:var(--accent-ink);text-decoration:underline">${esc(s.who)}</span> ${kindChip(s.k)}</div>
          <div class="meta">${esc(s.orgs.slice(0, 2).join('; ') || 'no organization given')}${
            s.norgs > 2 ? ` and ${num(s.norgs - 2)} more` : ''} &middot; ${esc(s.first)}&ndash;${esc(s.last)}
            &middot; ${stance}</div>
          ${s.aka.length ? `<div class="meta">also filed as ${esc(s.aka.join('; '))}</div>` : ''}
          <div class="track" role="img" aria-label="${esc(s.who)}: ${stance.replace(/&middot;/g, ',')}">${segs}</div>
        </div>
        <div class="n">${num(s.n)}<small>${s.n === 1 ? 'FILING' : 'FILINGS'}</small>
          <small>on ${plural(s.bills, 'bill')}</small></div>
      </a>`;
    }).join('') : '<div class="empty">No one matches these filters.</div>';
    const more = $('#more');
    more.hidden = rows.length <= limit;
    more.textContent = `Show ${num(Math.min(60, rows.length - limit))} more of ${num(rows.length - limit)} remaining`;
  }

  $('#more').addEventListener('click', () => { limit += 60; draw(); });
  $$('#sortseg button').forEach(b => b.addEventListener('click', () => {
    sortKey = b.dataset.s;
    $$('#sortseg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    limit = 60; draw();
  }));
  $('#dl').addEventListener('click', () => downloadCSV('ct-who-testified.csv', current(), [
    { key: 'who', label: 'party' }, { key: 'n', label: 'filings' },
    { key: 'bills', label: 'bills' }, { key: 'first', label: 'first_year' },
    { key: 'last', label: 'last_year' }, { key: 'sup', label: 'supporting' },
    { key: 'opp', label: 'opposing' }, { key: 'oth', label: 'other_or_unstated' },
    { label: 'organizations', get: r => r.orgs.join('; ') },
    { label: 'other_spellings_in_the_record', get: r => r.aka.join('; ') }]));

  wire(['q', 'kd', 'yr', 'st', 'rep'], () => { limit = 60; draw(); });
  $('#list').addEventListener('click', e => { const a = e.target.closest('[data-id]'); if (!a) return; e.preventDefault();
    history.replaceState(null, '', '?id=' + a.dataset.id); profile(a.dataset.id); });
  if (qs.get('id')) profile(qs.get('id'));
  if (qs.get('q')) { $('#q').value = qs.get('q'); draw(); }
} catch (e) { fail(document.querySelector('#list'), e); }

</script>
</body>
</html>
