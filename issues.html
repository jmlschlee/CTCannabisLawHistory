<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues &middot; CT Cannabis Law Timeline</title>
<meta name="description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Issues &middot; CT Cannabis Law Timeline">
<meta property="og:description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script>
/* set the theme before first paint so the page never flashes the wrong one */
try { var t = localStorage.getItem('ctcl-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<main id="main">

<div class="page-head">
  <div class="eyebrow">Fourteen ways into the same record</div>
  <h1>Issues</h1>
  <p class="lede">The main subjects in Connecticut cannabis law, each with the changes and open questions that belong to it.</p>
</div>
<div class="records" id="list"></div>

</main>
<script type="module">

import { load, $, num, esc, setSources } from './assets/app.js';
const [d, s] = await Promise.all([load('issues'), load('sources')]);
setSources(s.map);
const G = {}; d.gaps.forEach(g => G[g.id] = g);

$('#list').innerHTML = d.issues.sort((a,b)=>b.n-a.n).map(i => `
  <article class="rec" id="${esc(i.id)}">
    <div class="rec-head">
      <h3 class="rec-title">${esc(i.name)}</h3>
      <span class="rec-sub">${num(i.n)} enacted changes</span>
    </div>
    <p class="rec-body" style="margin:.1rem 0 .5rem">${esc(i.desc)}</p>
    <dl class="kv">
      <dt>Acts touching it</dt><dd>${esc(i.acts.join('; ') || '\u2014')}</dd>
    </dl>
    <div class="chips" style="margin-top:.6rem">
      <a class="chip" href="laws.html?cat=${encodeURIComponent(i.cat)}">See the ${num(i.n)} changes</a>
      <a class="chip" href="timeline.html">See them on the timeline</a>
    </div>
    ${i.gaps.length ? (() => { const gs = i.gaps.map(gid => G[gid]).filter(Boolean);
      const openN = gs.filter(g => g.res !== 'closed').length;
      const L = { closed: ['ok', 'Closed'], partial: ['warn', 'Partly closed'], open: ['bad', 'Open'] };
      return `<div class="callout ${openN ? 'warn' : 'note'}" style="margin:.7rem 0 0">
      <div class="hd">Gaps on this issue: ${["closed","partial","open"].map(k => [k, gs.filter(g => g.res === k).length]).filter(([, n]) => n).map(([k, n]) => `${n} ${L[k][1].toLowerCase()}`).join(", ")}</div>
      <ul class="clean">${gs.map(g => `
        <li class="small" style="margin-bottom:.5rem"><span class="chip ${L[g.res][0]}">${L[g.res][1]}</span> ${esc(g.what)}
        ${g.found ? `<br><span style="color:var(--ink-muted)">${esc(g.found.length > 260 ? g.found.slice(0, 257) + '…' : g.found)}</span>` : ''}
        ${g.res !== 'closed' && g.left ? `<br><em>Still missing:</em> ${esc(g.left)}` : ''}
        <br><a href="gaps.html#${esc(g.id)}">Full record and sources &rarr;</a></li>`).join('')}</ul></div>`; })() : ''}
  </article>`).join('');

if (location.hash) {
  const t = document.getElementById(location.hash.slice(1));
  if (t) t.scrollIntoView();
}

</script>
</body>
</html>
