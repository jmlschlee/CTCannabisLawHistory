<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changes &middot; CT Cannabis Law</title>
<meta name="description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Changes &middot; CT Cannabis Law">
<meta property="og:description" content="Connecticut cannabis law, year by year: what changed, when it changed, who proposed it, who testified for and against, which agency implemented it, and what the public record does and does not show about influence. Built from the enacted public acts.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script>
/* set the theme before first paint so the page never flashes the wrong one */
try { var t = localStorage.getItem('ctcl-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<main id="main">

<div class="page-head">
  <div class="eyebrow">Every enacted change, act by act</div>
  <h1>What changed</h1>
  <p class="lede">Every change to Connecticut cannabis law since 2012, section by section: what the old rule said, what the new one says, and when it took effect. Pick a subject or an act to narrow it down.</p>
</div>
<h2>Pick a subject</h2>
<div id="catgroups"></div>

<h2>The acts</h2>
<div class="grid three" id="acts"></div>

<h2>Every change</h2>
<div class="filters" id="f"></div>
<div class="resultbar"><span id="count"></span>
  <button class="btn" id="dl" type="button">Download this view as CSV</button></div>
<div class="records" id="list"></div>
<div class="pagenav"><button class="btn" id="more" type="button" hidden>Show more</button></div>

</main>
<script type="module">

import { load, $, $$, num, esc, cap, fmtDate, plural, cite, setSources, searchField,
         selectField, clearButton, wire, downloadCSV, fail } from './assets/app.js';

try {
  const [d, src] = await Promise.all([load('laws'), load('sources')]);
  setSources(src.map);

  /* Fifteen flat categories become four groups a reader can scan. */
  const GROUPS = [
    ['Who may take part', ['licensing', 'ownership and control', 'social equity',
      'medical patients and caregivers', 'home grow and possession']],
    ['What the product must be', ['testing and laboratories', 'advertising and packaging',
      'hemp and infused beverages']],
    ['Who enforces it', ['agency duties and rulemaking', 'enforcement and penalties',
      'municipal authority', 'ombudsman']],
    ['Money and oversight', ['taxation and revenue', 'data and reporting', 'uncategorized']],
  ];
  const catN = {};
  d.changes.forEach(c => (c.cat || []).forEach(k => catN[k] = (catN[k] || 0) + 1));

  $('#catgroups').innerHTML = `<div class="grid two">${GROUPS.map(([g, cats]) => `
    <div class="card"><h3 style="margin:0 0 .6rem">${esc(g)}</h3>
      <div class="chips">${cats.filter(c => catN[c]).map(c =>
        `<button class="chip" type="button" data-cat="${esc(c)}">${esc(cap(c))}
          <span class="muted">${num(catN[c] || 0)}</span></button>`).join('')}</div></div>`).join('')}</div>`;

  $('#acts').innerHTML = d.acts.filter(a => a.n > 0)
    .sort((a, b) => b.n - a.n).map(a => `
    <button class="card" type="button" data-act="${esc(a.id)}"
      style="text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch">
      <div class="chips" style="margin-bottom:.4rem"><span class="chip mono">${esc(a.pa)}</span>
        <span class="chip">${esc(a.bill)}</span></div>
      <h3 style="font-weight:640;font-size:.98rem;margin:0 0 .25rem">${esc(a.short || a.title)}</h3>
      <div class="small muted" style="margin-top:auto">${plural(a.n, 'change')} &middot; signed ${esc(fmtDate(a.signed))} &middot; <a href="bills.html?id=${esc(a.billid || '')}" onclick="event.stopPropagation()">bill history</a></div>
    </button>`).join('');

  $('#f').innerHTML =
    searchField('q', 'Search', 'statute cite, act, section, text') +
    selectField('act', 'Act', d.acts.filter(a => a.n > 0).map(a => [a.id, a.pa])) +
    selectField('cat', 'Subject', d.categories.filter(c => catN[c]).map(c => [c, `${cap(c)} (${num(catN[c])})`])) +
    selectField('pop', 'Who it reaches', d.populations.map(x => [x, cap(x)])) +
    selectField('flag', 'Flag', [['rep', 'Repeals'], ['del', 'Delayed effective date'],
                                 ['new', 'New section']]) +
    clearButton();

  let limit = 25;
  function current() {
    const q = $('#q').value.trim().toLowerCase(), act = $('#act').value,
          cat = $('#cat').value, pop = $('#pop').value, flag = $('#flag').value;
    return d.changes.filter(c =>
      (!act || c.paid === act) &&
      (!cat || (c.cat || []).includes(cat)) &&
      (!pop || (c.pop || []).includes(pop)) &&
      (!flag || (flag === 'rep' ? c.rep : flag === 'del' ? c.del : /NEW/i.test(c.act))) &&
      (!q || (c.cite + ' ' + c.pa + ' ' + c.sec + ' ' + c.act + ' ' + (c.new || '') + ' ' + (c.old || ''))
        .toLowerCase().includes(q)));
  }

  function draw() {
    const rows = current();
    $('#count').innerHTML = `<strong>${num(rows.length)}</strong> of ${num(d.changes.length)} enacted changes`
      + (rows.length > limit ? ` &middot; showing the first ${num(limit)}` : '');
    $('#list').innerHTML = rows.length ? rows.slice(0, limit).map(c => `
      <article class="rec" id="${esc(c.id)}">
        <div class="rec-head">
          <h3 class="rec-title">${esc(c.pa)} &middot; ${esc(c.sec)}</h3>
          <span class="rec-sub">effective ${esc(fmtDate(c.eff) || c.efft || 'not stated')}</span>
        </div>
        <div class="chips" style="margin-bottom:.5rem">
          ${c.rep ? '<span class="chip bad">repeals a provision</span>' : ''}
          ${c.del ? '<span class="chip warn">takes effect later than passage</span>' : ''}
          ${/NEW/i.test(c.act) ? '<span class="chip ok">new section</span>' : ''}
          ${(c.cat || []).slice(0, 4).map(k => `<span class="chip">${esc(cap(k))}</span>`).join('')}
        </div>
        <dl class="kv">
          <dt>Statute touched</dt><dd class="mono">${esc(c.cite || 'no statute cite on the section')}</dd>
          <dt>Who it reaches</dt><dd>${esc((c.pop || []).map(cap).join('; ') || 'Not stated in the section head')}</dd>
        </dl>
        <details class="more"><summary>Old text and new text</summary>
          <div class="diff pair">
            <div class="pane old"><div class="lab">What the act removed</div>
              <div class="txt">${esc(c.old || c.oldb || 'the act prints no deleted text for this section')}</div></div>
            <div class="pane new"><div class="lab">What it put in place</div>
              <div class="txt">${esc((c.new || '').slice(0, 4000) || 'not printed')}</div></div>
          </div>
        </details>
        ${cite(c.s, c.pa + ' ' + c.sec)}
      </article>`).join('') : '<div class="empty">No changes match these filters.</div>';
    const m = $('#more');
    m.hidden = rows.length <= limit;
    m.textContent = `Show ${num(Math.min(25, rows.length - limit))} more`;
  }

  document.addEventListener('click', e => {
    const cb = e.target.closest('[data-cat]'), ab = e.target.closest('[data-act]');
    if (cb) { $('#cat').value = cb.dataset.cat; limit = 25; draw(); $('#f').scrollIntoView(); }
    if (ab) { $('#act').value = ab.dataset.act; limit = 25; draw(); $('#f').scrollIntoView(); }
  });
  $('#more').addEventListener('click', () => { limit += 25; draw(); });
  $('#dl').addEventListener('click', () => downloadCSV('ct-law-changes-view.csv', current(), [
    { key: 'id', label: 'change_id' }, { key: 'pa', label: 'public_act' },
    { key: 'sec', label: 'section' }, { key: 'cite', label: 'statute_cite' },
    { key: 'eff', label: 'effective_date' }, { key: 'efft', label: 'effective_text' },
    { label: 'categories', get: r => (r.cat || []).join('; ') },
    { label: 'population', get: r => (r.pop || []).join('; ') },
    { key: 'rep', label: 'is_repeal' }, { key: 'del', label: 'delayed_effect' },
    { key: 's', label: 'source_id' }]));

  const p = new URLSearchParams(location.search);
  wire(['q', 'act', 'cat', 'pop', 'flag'], () => { limit = 25; draw(); });
  if (p.get('cat')) { $('#cat').value = p.get('cat'); draw(); }
} catch (e) { fail(document.querySelector('#list'), e); }

</script>
</body>
</html>
